<div class="parent">
  <div class="section">
    <div class="logo">
      <img src="assets/logo.svg" alt="logo zawolf" loading="lazy" />
    </div>
    <h1>تسجيل الدخول</h1>
    <form (ngSubmit)="loginUser()" class="form-login" autocomplete="off">
      <!-- input user name  -->
      <div class="form-login">
        <label for="name">اسم المستخدم</label>
        <input
          id="name"
          type="text"
          name="login"
          [(ngModel)]="login"
          placeholder="إدخل  إسم المستخدم"
          autocomplete="off"
          required
        />
        @if(fieldErrors['login']){
                <small class="error" >
          {{ fieldErrors["login"] }}
        </small>
        }
      </div>

      <!-- input password  -->
      <div class="form-login">
        <label for="password">كلمة المرور</label>

        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            placeholder="ادخل كلمة المرور"
            autocomplete="new-password"
            required
          />
          <i
            class="bi bi-eye-fill toggle-password"
            (click)="togglePassword()"
          ></i>
        </div>

        @if(fieldErrors['password']){
          <small class="error">
            {{ fieldErrors["password"] }}
          </small>
        }
      </div>

      <div class="check-group">
        <a routerLink="/forget-password">نسيت كلمة السر</a>
        <input type="checkbox" class="custom-checkbox" />
      </div>
      <button type="submit">متابعه</button>
      @if(errorMessage){
        <p class="error" >{{ errorMessage }}</p>
      }
    </form>
  </div>
</div>
