<div class="parent-container">
  <!-- page header -->
  <app-page-header
    [title]="pageTitle"
    [breadcrumb]="breadcrumb"
    [actionButtons]="actionButtons"
  ></app-page-header>

  <!--------------- import and export ------------>
  <div class="search-parent border-gradient mb-4">
    <div class="form-grid-search">
      <div class="form-field">
        <app-dropdown
          [options]="countryOptions"
          [selectedOption]="selectedCountry || ''"
          [label]="'اختر الدولة'"
          (optionSelected)="onCountryMethodChange($event)"
        ></app-dropdown>
      </div>

      <div class="form-field">
        <app-dropdown
          [disabled]="!selectedCountry"
          [options]="cityOptions"
          [selectedOption]="selectedCity || ''"
          [label]="selectedCountry ? 'اختر المدينة' : 'اختر الدولة اولا'"
          (optionSelected)="onCityChange($event)"
          [disabled]="!selectedCountry"
        ></app-dropdown>
      </div>

      <div class="form-field search-field">
        <app-search-input
          [placeholder]="searchPlaceholder"
          (search)="onSearch($event)"
        ></app-search-input>
      </div>
    </div>
  </div>

  <!-- grid cards -->
  <app-grid-cards [isLoading]="false" [error]="false">
    <app-card
      *ngFor="
        let company of companyList$();
        trackBy: trackByCompanyId;
        index as i
      "
      [data]="company"
      [index]="i"
      [selectable]="true"
      [isSelected]="isCompanySelected(company)"
      (selectionChange)="onCardSelectionChange(company, $event)"
      [titleKey]="'name'"
      [subTitleKey]="'industeryName'"
      [fields]="[
        { label: 'البريد الإلكتروني', key: 'email', icon: 'bi bi-envelope' },
        { label: 'الهاتف', key: 'phoneNumber', icon: 'bi bi-telephone-fill' }
      ]"
      [infoBoxes]="[
        { label: 'المدينة', key: 'cityName', icon: 'bi bi-geo-alt' },
        { label: 'الدولة', key: 'countryName', icon: 'bi bi-geo-alt' }
      ]"
      [rating]="2"
    ></app-card>
  </app-grid-cards>
  <!-- No results message - only show when there's an active text search -->
  <app-no-results-message
    *ngIf="hasActiveSearchTerm && hasNoCompanies"
    title="لا يوجد نتائج للبحث"
    description="لم يتم العثور على شركات مطابقين لمعايير البحث"
    icon="bi bi-search"
    [showResetButton]="true"
    resetButtonText="إعادة تعيين الفلاتر"
    resetButtonClass="btn btn-danger"
    (resetClick)="resetFilters()"
  ></app-no-results-message>
</div>
