<div class="pdf-preview-dialog">
  <!-- Dialog Header -->
  <div class="dialog-header">
    <h2 class="dialog-title">{{ data?.title || "معاينة الفاتورة" }}</h2>
    <div class="header-actions">
      <button
        type="button"
        class="action-btn download-btn"
        (click)="onDownload()"
        title="تحميل"
        *ngIf="isBrowser"
      >
        <i class="bi bi-download"></i>
        <span>تحميل</span>
      </button>
      <button type="button" class="close-btn" (click)="onClose()" title="إغلاق">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </div>

  <!-- PDF Viewer - Using iframe to avoid SSR issues with PdfViewerModule -->
  <div class="pdf-viewer-container" *ngIf="isBrowser && pdfSrc">
    <iframe
      [src]="safePdfUrl"
      style="width: 100%; height: 100%; border: none"
      title="PDF Preview"
    ></iframe>
  </div>

  <!-- Fallback for SSR or if PDF not available -->
  <div class="pdf-fallback" *ngIf="!isBrowser || !pdfSrc">
    <div class="fallback-content">
      <i
        class="bi bi-file-earmark-pdf"
        style="font-size: 48px; color: #ef4444"
      ></i>
      <p>جارٍ تحميل معاينة PDF...</p>
      <a *ngIf="pdfSrc" [href]="pdfSrc" target="_blank" class="open-link-btn">
        <i class="bi bi-box-arrow-up-right"></i>
        <span>فتح في نافذة جديدة</span>
      </a>
    </div>
  </div>
</div>
