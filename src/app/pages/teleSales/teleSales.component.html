@if(!isLoading()){
<section class="dashboard-info">
  <!-- page header -->
  <app-page-header
    [title]="pageTitle"
    [breadcrumb]="breadcrumb"
  ></app-page-header>

  <!-- Content (shown when data is loaded) -->
    <app-count-card [stats]="stats()"></app-count-card>
    <app-first-charts></app-first-charts>

    <!-- ==================================== GetTransferredLeadsToSales ============================ -->
    <div class="table-container">
      <app-table
        [data]="transferredLeads()"
        [columns]="transferredLeadsColumns"
        [showIndex]="true"
      >
      </app-table>
    </div>

    <!-- أفضل 3 TeleSales -->
    <div class="top-salespeople-section border-card">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
      <h2 class="section-title">Best 3 TeleSales</h2>
      <div class="salespeople-list">
        <div
          *ngFor="let person of topTeleSales(); index as index"
          class="salesperson-card"
          [class.rank-1]="index === 0"
          [class.rank-2]="index === 1"
          [class.rank-3]="index === 2"
        >
          <div class="salesperson-content">
            <div class="profile-section">
              <!-- Medal Badge -->
              <div class="medal-badge">
                <img
                  class="medal-icon"
                  [src]="getMedalIcon(index + 1)"
                  alt="medal"
                  [loading]="index === 0 ? 'eager' : 'lazy'"
                  [attr.fetchpriority]="index === 0 ? 'high' : 'auto'"
                  [decoding]="'async'"
                  width="40"
                  height="40"
                />
                <span class="medal-number">{{ index + 1 }}</span>
              </div>
              <div class="profile-image-wrapper">
                <!-- Profile Image -->
                <img
                  [src]="
                    person.profileImage
                      ? person.profileImage
                      : './assets/img/avatar-male.svg'
                  "
                  [alt]="person.teleSalesName"
                  class="profile-image"
                  [loading]="index === 0 ? 'eager' : 'lazy'"
                  [attr.fetchpriority]="index === 0 ? 'high' : 'auto'"
                  [decoding]="'async'"
                  (error)="onProfileImageError($event)"
                  width="120"
                  height="120"
                />
              </div>
              <h3 class="salesperson-name">{{ person.teleSalesName }}</h3>
            </div>

            <div class="stat-item">
              <span class="stat-label">إجمالي الصفقات</span>
              <span class="stat-value">{{ person.totalLeads }} صفقة مغلقة</span>
            </div>
          </div>
        </div>
      </div>
      <app-no-results-message
        *ngIf="topTeleSales().length === 0"
        title="لا يوجد بيانات متاحة"
        description="لا يوجد مندوبين حاليا"
        icon="bi bi-person-fill-x"
        [showResetButton]="false"
      ></app-no-results-message>
    </div>
 
</section>
}
