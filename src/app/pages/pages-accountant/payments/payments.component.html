<div class="parent-container">
  <!-- page header -->
  <app-page-header
    [title]="pageTitle"
    [breadcrumb]="breadcrumb"
  ></app-page-header>

  <!-- count card -->
  <app-count-card [stats]="stats"></app-count-card>

  <!-- search and dropdown -->
  <div class="search-container border-gradient">
    <app-search-input
      [placeholder]="searchPlaceholder"
      (search)="onSearch($event)"
    ></app-search-input>
    <!-- <div class="dropdown-container">
      <app-dropdown
        label="اختر الحالة"
        [options]="['مدفوعة', 'متأخرة', 'قيد المراجعة', 'غير مدفوعة', 'ملغاة']"
        (optionSelected)="onOptionSelected($event)"
      ></app-dropdown>
    </div> -->
  </div>
  <!-- table -->
  <div class="table-container mt-md">
    <app-table
      [data]="payments()"
      [columns]="paymentsColumns"
      [showDataTable]="true"
      [showIndex]="true"
      [hasNoData]="payments().length === 0"
    ></app-table>
  </div>
</div>
