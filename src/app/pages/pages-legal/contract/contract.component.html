<section class="dashboard-info">
  <h1 class="welcome-section">
    مرحباً بك <span>{{ userInfo().name || "المستخدم" }}</span> في لوحة تحكم -
    الشؤون القانونية
  </h1>
</section>

<div class="parent-container">
  <!-- page header -->
  <app-page-header
    [title]="pageTitle"
    [breadcrumb]="breadcrumb"
  ></app-page-header>
  <!-- search and dropdown -->
  <div class="search-container border-gradient">
    <form [formGroup]="filterForm" (ngSubmit)="onFilterSubmit()">
      <div class="form-grid-search">
        <!-- <div class="form-field">
          <app-dropdown
            [options]="contractStatusList"
            [selectedOption]="selectedContractStatus || ''"
            [label]="'اختر حالة العقد '"
            (optionSelected)="onContractStatusChange($event)"
          ></app-dropdown>
        </div> -->
        <app-search-input
          [placeholder]="'ابحث عن العقود'"
          (search)="onSearch($event)"
        ></app-search-input>
      </div>
    </form>
  </div>
  <!-- content -->
  <div class="content mt-md">
    <div class="table-container">
      <app-table
        [data]="listContracts()"
        [columns]="columns"
        [showIndex]="true"
        [showAdd]="true"
        [selectedRows]="selectedRows()"
        [showDataTable]="true"
        [actionTitles]="actionTitles"
        [hasNoData]="hasNoData()"
        [pageSize]="pageSize()"
        [currentPage]="currentPage()"
        [totalCount]="totalCount()"
        (pageChange)="onPageChange($event)"
        (addButtonClick)="onAddContract($event)"
        (pageSizeChange)="onPageSizeChange($event)"
        [noDataMessage]="'لا يوجد عقود لعرضها'"
      ></app-table>
    </div>
  </div>
</div>
