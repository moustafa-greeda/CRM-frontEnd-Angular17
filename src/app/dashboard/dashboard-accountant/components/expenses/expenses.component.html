<div class="parent-container">
  <!---------------------- page header ---------------------------------->
  <app-page-header
    [title]="pageTitle"
    [breadcrumb]="breadcrumb"
  ></app-page-header>

  <!--------------------- form add expenses ------------------------------>
  <div class="add-expenses-container border-gradient">
    <h3>اضافة مصروف جديد</h3>
    <form
      [formGroup]="expensesForm"
      (ngSubmit)="onExpensesSubmit()"
      class="form-container"
    >
      <div class="form-grid">
        <!-- expense name -->
        <div class="form-field">
          <label>وصف المصروفات</label>
          <input
            type="text"
            formControlName="expenseName"
            placeholder="ادخل وصف المصروف"
            class="form-input"
            [class.error]="
              expensesForm.get('expenseName')?.invalid &&
              expensesForm.get('expenseName')?.touched
            "
          />
          <small
            class="error-message"
            *ngIf="
              expensesForm.get('expenseName')?.invalid &&
              expensesForm.get('expenseName')?.touched
            "
          >
            وصف المصروف مطلوب
          </small>
        </div>
        <!-- amount -->
        <div class="form-field">
          <label>المبلغ</label>
          <input
            type="number"
            formControlName="amount"
            placeholder="ادخل المبلغ المصروف"
            class="form-input"
            [class.error]="
              expensesForm.get('amount')?.invalid &&
              expensesForm.get('amount')?.touched
            "
          />
          <small
            class="error-message"
            *ngIf="
              expensesForm.get('amount')?.invalid &&
              expensesForm.get('amount')?.touched
            "
          >
            المبلغ المصروف مطلوب
          </small>
        </div>
        <!-- date -->
        <div class="form-field">
          <label>التاريخ</label>
          <input
            type="date"
            formControlName="expenseDate"
            placeholder="ادخل تاريخ الصرف"
            class="form-input"
            [class.error]="
              expensesForm.get('expenseDate')?.invalid &&
              expensesForm.get('expenseDate')?.touched
            "
          />
          <small
            class="error-message"
            *ngIf="
              expensesForm.get('expenseDate')?.invalid &&
              expensesForm.get('expenseDate')?.touched
            "
          >
            تاريخ الصرف مطلوب
          </small>
        </div>
      </div>
      <!-- button submit -->
      <div class="parent-button">
        <button type="submit" class="btn btn-primary">حفظ المصروف</button>
      </div>
    </form>
  </div>
  <!---------------------------- search container ---------------------------------->
  <div class="add-expenses-container border-gradient mt-md">
    <h3>بحث</h3>
    <form
      [formGroup]="searchForm"
      (ngSubmit)="onSearchSubmit()"
      class="form-container"
    >
      <div class="form-grid-search">
        <div class="form-field">
          <label>ابحث عن المصروفات</label>
          <input
            type="text"
            class="search-input"
            formControlName="expenseName"
            placeholder="ابحث عن المصروفات"
          />
        </div>
        <div class="form-field">
          <label>ابحث عن المبلغ</label>
          <input
            type="text"
            class="search-input"
            formControlName="amount"
            placeholder="ابحث عن المبلغ"
          />
        </div>
        <div class="form-feild">
          <label>ابحث عن المدة</label>
          <app-dropdown
            id="filter-dropdown"
            [options]="filterOptions"
            [selectedOption]="filterValue"
            [label]="'اختر المده'"
            (optionSelected)="onFilterChange($event)"
          ></app-dropdown>
        </div>
        <div class="form-field">
          <label>من</label>
          <input
            type="date"
            formControlName="datefrom"
            placeholder="اختر تاريخ البداية"
            class="form-input"
          />
        </div>
        <div class="form-field">
          <label>الي</label>
          <input
            type="date"
            formControlName="dateTo"
            placeholder="اختر تاريخ النهاية"
            class="form-input"
          />
        </div>

        <div class="parent-button">
          <!-- button search -->
          <button
            class="btn btn-primary search-button"
            (click)="onSearch($event)"
          >
            <i class="bi bi-search"></i>
            بحث
          </button>
        </div>
      </div>
    </form>
  </div>
  <!---------------------------- table ---------------------------------->
  <div class="table-container mt-md">
    <app-table
      [data]="expensesData"
      [columns]="expensesColumns"
      [showDataTable]="true"
      [hasNoData]="expensesData.length === 0"
      [pageSize]="pageSize"
      [showIndex]="true"
      [showAdd]="false"
      [showEdit]="false"
      [actionTitles]="{
        view: 'عرض تفاصيل المصروفات',
        add: 'إضافة مصروفات جديدة',
        edit: 'تعديل بيانات المصروفات',
      }"
      [currentPage]="currentPage"
      [totalCount]="totalCount"
    ></app-table>

    <!-- Total Amount Footer -->
    <div class="table-footer" *ngIf="expensesData.length > 0">
      <table class="footer-table">
        <tbody>
          <tr class="total-row">
            <td></td>
            <td class="total-label">المبلغ الإجمالي:</td>
            <td class="total-value">
              {{ getTotalAmount() | number : "1.2-2" }}
            </td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

      (edit)="onEditExpenses($event)"
      (view)="onViewExpenses($event)" -->
