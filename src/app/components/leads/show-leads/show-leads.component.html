<div class="client-management-container">
  <!----------------------- Header Section ------------------>
  <app-page-header
    [title]="pageTitle"
    [breadcrumb]="breadcrumb"
    [actionButtons]="actionButtons"
  ></app-page-header>

  <!----------------------- Search Bar filter section ----------->
  <section class="filter">
    <!-- right section -->
    <div class="filter-search-bar">
      <div class="search-section">
        <app-search-input
          [placeholder]="getSearchPlaceholder()"
          (search)="onSearch($any($event))"
        ></app-search-input>
      </div>
    </div>
    <!-- left section -->
    <div class="parent-left">
      <app-button
        [buttonText]="'إنشاء عميل محتمل'"
        [icon]="'bi bi-plus-circle'"
        (click)="createLeadForSelectedClients()"
        [disabled]="selectedCards.length === 0"
      ></app-button>

      <!-- count lead -->
      <div class="countLead">
        <p class="countLead-text">
          {{
            selectedCards.length > 0
              ? selectedCards.length + " محدد من " + filteredClients.length
              : filteredClients.length
          }}
          من {{ totalCount }} عميل
        </p>
        <i class="bi bi-person-fill"></i>
      </div>
    </div>
  </section>

  <!-- import and export -->
  <div class="filter">
    <!--parent import -->
    <div class="parent-import">
      <!----------------------- View Toggle Button ----------->
      <div class="view-toggle-container">
        <app-view-toggle
          [viewMode]="viewMode"
          (viewModeChange)="onViewModeChange($any($event))"
        ></app-view-toggle>
      </div>
      <!-- select all -->
      <div class="select-all">
        <p class="select-all-text">تحديد الكل</p>
        <div class="checkbox-wrapper">
          <input
            type="checkbox"
            class="custom-checkbox"
            [checked]="isAllSelected"
            (change)="onSelectAllChange($event)"
          />
        </div>
      </div>

      <!-- delet lead -->
      <!-- <i class="bi bi-trash3"></i> -->
    </div>
    <!-- Custom Pagination Controls (cards only) -->
    <app-pagination-card-controls
      *ngIf="viewMode === 'card'"
      [currentPage]="currentPage"
      [totalPages]="totalPages"
      [pageSize]="pageSize"
      [pageSizeOptions]="[10, 50, 100, 500]"
      (pageSizeChange)="onPageSizeChange($event)"
    ></app-pagination-card-controls>
  </div>

  <!------------------------- Client Cards Grid ---------------------->
  <app-grid-cards
    [isLoading]="false"
    [error]="false"
    *ngIf="!isLoading && !error && viewMode === 'card'"
  >
    <app-card
      *ngFor="
        let client of filteredClients;
        trackBy: trackByClientId;
        index as i
      "
      [data]="client"
      [index]="i"
      [showSelectBox]="true"
      [titleKey]="'name'"
      [subTitleKey]="'contactSource'"
      [fields]="[
        { label: 'البريد الإلكتروني', key: 'email', icon: 'bi bi-envelope' },
        { label: 'الهاتف', key: 'phone', icon: 'bi bi-telephone-fill' }
      ]"
      [infoBoxes]="[
        { label: 'اسم الصناعة', value: client.industeryName },
        { label: 'اسم الشركة', value: client.companyName }
      ]"
      [selectable]="true"
      [isSelected]="isCardSelected(client)"
      (selectionChange)="onCardSelectionChange(client, $event)"
    ></app-card>
  </app-grid-cards>

  <!------------------------- Table View (Reusable) ---------------------->
  <div
    class="table-view-container"
    *ngIf="!isLoading && !error && viewMode === 'table'"
  >
    <app-table
      [data]="filteredClients"
      [columns]="tableColumns"
      [selectedRows]="selectedCards"
      [pageSize]="pageSize"
      [currentPage]="currentPage"
      [totalCount]="totalCount"
      [showIndex]="true"
      [showCheckbox]="true"
      (rowSelectionChange)="onTableRowSelection($event)"
      (selectAllChange)="onTableSelectAll($event)"
      (pageChange)="onTablePage($event)"
      (pageSizeChange)="onTablePageSize($event)"
      (view)="onViewClient($event)"
      (edit)="onEditClient($event)"
      (delete)="onDeleteClient($event)"
    ></app-table>
  </div>

  <!-- Custom Pagination Navigation (cards only) -->

  <app-pagination-card
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    [isLoading]="isLoading"
    (pageChange)="handlePageChange($event)"
  ></app-pagination-card>

  <!-- no employees message -->
  <app-no-results-message
    *ngIf="filteredClients.length === 0 && !isLoading"
    title="لا يوجد بيانات حاليا "
    description="لا يوجد عملاء حاليا"
    icon="bi bi-person-fill-x"
    [showResetButton]="false"
  ></app-no-results-message>
</div>
