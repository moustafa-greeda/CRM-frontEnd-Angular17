<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>ERB ZaWolf</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="assets/logo.svg" />
    
    <!-- Preload critical images for LCP optimization -->
    <link rel="preload" as="image" href="assets/img/avatar-male.svg" fetchpriority="high" />
    <link rel="preload" as="image" href="assets/img/avatar-female.svg" />
    <!-- Preload teleSales stat images (first card is LCP element) -->
    <link rel="preload" as="image" href="assets/img/teleSalse-admin/call.svg" fetchpriority="high" />
    <link rel="preload" as="image" href="assets/img/teleSalse-admin/blue-user.svg" />
    <link rel="preload" as="image" href="assets/img/first.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cairo:wght@200..1000&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var system =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          var theme = saved || system;
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
