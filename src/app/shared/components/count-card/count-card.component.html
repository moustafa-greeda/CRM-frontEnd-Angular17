<div class="dashboard-header">
  <h5>{{ title }}</h5>
</div>

<div class="stats-grid">
  <div class="stat-card" *ngFor="let stat of stats; let i = index">
    <div class="stat-card-content">
      <h3>{{ stat.title }}</h3>
      @if (stat.subtitle) {
      <p class="stat-subtitle">{{ stat.subtitle }}</p>
      }
      <p [ngClass]="{ 'small-count': stat.title === 'القيمة الإجمالية' }">
        {{ stat.count }}
      </p>
      @if (stat.details?.length) {
      <ul class="stat-details">
        <li *ngFor="let detail of stat.details">
          <span class="detail-label">{{ detail.label }}</span>
          <span class="detail-value">{{ detail.value }}</span>
        </li>
      </ul>
      }
    </div>
    @if (stat.imageSrc) {
    <img 
      [src]="stat.imageSrc" 
      [alt]="stat.title" 
      class="stat-card-image"
      [loading]="i === 0 ? 'eager' : 'lazy'"
      [attr.fetchpriority]="i === 0 ? 'high' : 'auto'"
      [decoding]="'async'"
      width="80"
      height="80"
      (error)="onImageError($event, stat.imageSrc)"
    />
    } @else {
    <i class="bi {{ stat.icon }}"></i>
    }
  </div>
</div>
