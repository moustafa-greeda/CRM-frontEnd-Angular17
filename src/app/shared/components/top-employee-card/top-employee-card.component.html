<div class="top-salespeople-section border-card">
  <span class="corner tl"></span>
  <span class="corner tr"></span>
  <span class="corner bl"></span>
  <span class="corner br"></span>
  
  <h2 class="section-title">{{ title }}</h2>
  
  <div class="salespeople-list">
    <div
      *ngFor="let person of topPeople; index as i"
      class="salesperson-card"
      [class.rank-1]="i === 0"
      [class.rank-2]="i === 1"
      [class.rank-3]="i === 2"
    >
      <div class="salesperson-content">
        <div class="profile-section">
          <!-- Medal Badge -->
          <div class="medal-badge">
            <img
              class="medal-icon"
              [src]="getMedalIcon(i + 1)"
              alt="medal"
              [loading]="i === 0 ? 'eager' : 'lazy'"
              width="40"
              height="40"
            />
          </div>
          
          <div class="profile-image-wrapper">
            <!-- Profile Image -->
            <img
              [src]="getProfileImage(person)"
              [alt]="getEmployeeName(person)"
              class="profile-image"
              [loading]="i === 0 ? 'eager' : 'lazy'"
              width="80"
              height="80"
            />
          </div>
          
          <h3 class="salesperson-name">{{ getEmployeeName(person) }}</h3>
        </div>

        <!-- Budget stat (only for Sales with totalBudget) -->
        <div class="stat-item" *ngIf="shouldShowBudget(person)">
          <span class="stat-label">إجمالي المبيعات</span>
          <span class="stat-value">{{ formatCurrency(person.totalBudget!) }}</span>
        </div>

        <!-- Leads stat (always shown) -->
        <div class="stat-item">
          <span class="stat-label">إجمالي الصفقات</span>
          <span class="stat-value">{{ person.totalLeads }} صفقة مغلقة</span>
        </div>
      </div>
    </div>

    <!-- No Data Message -->
    <app-no-results-message
      *ngIf="topPeople.length === 0"
      title="لا يوجد بيانات متاحة"
      description="لا يوجد sales حاليا"
      icon="bi bi-person-fill-x"
      [showResetButton]="false"
    ></app-no-results-message>
  </div>
</div>
